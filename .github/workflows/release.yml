# Builds the static binary for each platform on every push and, on a version
# tag, publishes them with a sha256sums.txt, which is what install.sh and
# install.ps1 download, and beside each asset its zstd-compressed form and
# a patch to it from each of the last PATCH_FROM releases, which is what
# `brain update` downloads when it can (jm/selfupdate, jm/tools/mkpatch).
#
# Versions are calendar tags the way Odin's are: dev-YYYY-MM, with a letter
# for a second release in a month (dev-2026-09a). dev-YYYY-MM-rcN is a
# release candidate, published as a prerelease, so releases/latest and
# `brain update` never offer it; BRAIN_VERSION=<tag> installs it.
name: release

on:
  push:
    branches: ["**"]
    tags: ["dev-*"]
  workflow_dispatch:

# CI builds the Odin compiler brainfold is developed with, not a release:
# the commit is tagged in the fork (setup-odin clones a branch or tag, never
# a bare commit), and LLVM matches the local build's major version. Moving
# to a newer Odin is: tag the new commit brainfold-pin-<short sha> in the
# fork, and change ODIN_PIN.
env:
  ODIN_REPO: https://github.com/JackMordaunt/Odin
  ODIN_PIN: brainfold-pin-984eb69e0
  ODIN_LLVM: "22"
  # How many earlier releases a tag publishes patches from. Prereleases
  # count too: a machine on an rc updates by patch like any other.
  PATCH_FROM: "3"
  # The libgit2 jm:git binds, built static into every binary.
  LIBGIT2_TAG: v1.9.7

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            asset: brain-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
            asset: brain-linux-arm64
          - os: macos-latest
            target: darwin_arm64
            asset: brain-darwin-arm64
          # Intel macOS is cross-compiled on the arm64 runner: the SQLite
          # archive is built with -arch x86_64 and Odin links for the target.
          - os: macos-latest
            target: darwin_amd64
            asset: brain-darwin-amd64
            cc: cc -arch x86_64
          - os: windows-latest
            target: windows_amd64
            asset: brain-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      # jm is a submodule, pinned to the commit local builds use.
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Before Odin: build.bat compiles it with MSVC.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.ODIN_REPO }}
          branch: ${{ env.ODIN_PIN }}
          release: ""
          llvm-version: ${{ env.ODIN_LLVM }}
          build-type: release
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.58.0"

      # jm:http links the system libcurl, so the link needs its dev symlink.
      - name: curl link deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      # jm:sqlite3 and jm:zstd link archives built from vendored
      # amalgamations with jm's own compile options; its recipes build them
      # on Unix.
      - name: sqlite and zstd archives
        if: runner.os != 'Windows'
        shell: bash
        run: cd jm && CC="${{ matrix.cc || 'cc' }}" just sqlite zstd
      # jm's Windows recipe is written for PowerShell; the same defines are
      # read out of its justfile text and given to cl directly. Not
      # `just --evaluate`: on Windows, just 1.4x refuses the whole file over
      # a recipe whose dependency is unix-only.
      - name: sqlite and zstd archives (windows)
        if: runner.os == 'Windows'
        shell: bash
        # Git Bash rewrites a /flag into C:/Program Files/Git/flag before
        # cl sees it, hence the dash flags and no path conversion at all.
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          defines=$(sed -n '/^sqlite_defines :=/,/[^\\]$/p' jm/justfile | grep -o '"[^"]*"' | tr -d '"' | tr -d '\n')
          echo "defines: $defines"
          cd jm && mkdir -p sqlite3/lib zstd/lib
          cl -nologo -O2 -c sqlite3/vendor/sqlite3.c -Fosqlite3/lib/sqlite3.obj $defines
          lib -nologo -OUT:sqlite3/lib/sqlite3.lib sqlite3/lib/sqlite3.obj
          cl -nologo -O2 -c zstd/vendor/zstd.c -Fozstd/lib/zstd.obj
          lib -nologo -OUT:zstd/lib/zstd.lib zstd/lib/zstd.obj

      # libgit2, static, at the revision jm:git is written against, so the
      # binary versions and syncs the vault with no git on the machine:
      # HTTPS through the platform (OpenSSL loaded at run time on Linux),
      # ssh through the platform's ssh binary. The recipe is jm's CI's;
      # Intel macOS is cross-built here like the rest of that target. Built
      # fresh every run, not cached: what this job builds is published, and
      # a cache another workflow could write would reach the binaries.
      - name: libgit2
        shell: bash
        run: |
          git clone -q --depth 1 --branch "$LIBGIT2_TAG" https://github.com/libgit2/libgit2 "$RUNNER_TEMP/libgit2"
          extra=()
          case "$RUNNER_OS" in
            Linux)   https=OpenSSL-Dynamic ;;
            macOS)   https=SecureTransport ;;
            Windows) https=WinHTTP; extra=(-G Ninja -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded) ;;
          esac
          if [ "${{ matrix.target }}" = darwin_amd64 ]; then extra=(-DCMAKE_OSX_ARCHITECTURES=x86_64); fi
          cmake -S "$RUNNER_TEMP/libgit2" -B "$RUNNER_TEMP/libgit2/build" "${extra[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DUSE_SSH=exec -DUSE_HTTPS="$https" \
            -DUSE_BUNDLED_ZLIB=ON -DREGEX_BACKEND=builtin -DUSE_HTTP_PARSER=builtin -DUSE_NTLMCLIENT=OFF -DUSE_SHA256=builtin
          cmake --build "$RUNNER_TEMP/libgit2/build" --config Release --parallel
          mkdir -p jm/git/lib
          if [ "$RUNNER_OS" = Windows ]; then cp "$RUNNER_TEMP/libgit2/build/git2.lib" jm/git/lib/; else cp "$RUNNER_TEMP/libgit2/build/libgit2.a" jm/git/lib/; fi

      # A tag build carries its version; any other build is "dev" and will
      # not update itself.
      - name: build
        shell: bash
        run: |
          mkdir -p build/release
          version=""
          case "$GITHUB_REF" in refs/tags/*) version="-define:VERSION=$GITHUB_REF_NAME" ;; esac
          odin build . -o:speed -vet -strict-style -collection:jm="$PWD/jm" $version \
            -define:COMMIT="\"${GITHUB_SHA::7}\"" \
            -target:${{ matrix.target }} -out:build/release/${{ matrix.asset }}
      - name: smoke test
        if: matrix.target != 'darwin_amd64'
        shell: bash
        run: |
          build/release/${{ matrix.asset }} version
          build/release/${{ matrix.asset }} help | head -1
          if [ "$RUNNER_OS" = Linux ]; then
            ldd build/release/${{ matrix.asset }}
            ! ldd build/release/${{ matrix.asset }} | grep -q libgit2 || { echo "::error::linked the system libgit2"; exit 1; }
          fi
          BRAIN_VAULT=testdata/vault BRAIN_STATE="$RUNNER_TEMP/state" build/release/${{ matrix.asset }} find sqlite
      # The package's tests and the installer tests, as `just test` runs them
      # locally, on every runner that can run what it builds. The publish job
      # needs every build, so a tag whose tests fail never ships. Windows runs
      # them without the address sanitizer: its HeapSize hook aborts inside
      # combase.dll and windows.storage.dll, on memory Windows allocated
      # itself (run 36725142759).
      - name: test
        if: matrix.target != 'darwin_amd64'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export SAN=; fi
          just test
      # The desk's suites, as `just desk-test` runs them locally: the view
      # swept at every window size, the CLI client and the app on canned
      # answers. Same sanitizer rule as above.
      - name: desk test
        if: matrix.target != 'darwin_amd64'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export SAN=; fi
          just desk-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: build/release/${{ matrix.asset }}
          if-no-files-found: error
      # jm's mkpatch, built once for the publish runner, which has no Odin
      # of its own; it links the zstd archive built above.
      - name: mkpatch
        if: matrix.target == 'linux_amd64'
        shell: bash
        run: odin build jm/tools/mkpatch -o:speed -vet -strict-style -collection:jm="$PWD/jm" -out:build/release/mkpatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'linux_amd64'
        with:
          name: mkpatch
          path: build/release/mkpatch
          if-no-files-found: error

  # The desk, tools/desk with its host, for each target, uploaded as a
  # workflow artifact and never as a release asset: desk binaries ship only
  # through Polar. It links jm:ui's native libraries, built here as jm's
  # test.yml builds them, fresh every run for the reason libgit2 is above.
  # SDL3 is the platform's at run time on Linux and macOS; on Windows its
  # DLL and AccessKit's travel beside the executables. The smoke renders the
  # fixture vault's Bullets page headless through the brain this run built.
  desk:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            asset: desk-linux-amd64
            brain: brain-linux-amd64
            accesskit: linux/x86_64/static
          - os: macos-latest
            target: darwin_arm64
            asset: desk-darwin-arm64
            brain: brain-darwin-arm64
            accesskit: macos/arm64/static
          # Cross-built on the arm64 runner like the CLI, so it is not run.
          - os: macos-latest
            target: darwin_amd64
            asset: desk-darwin-amd64
            accesskit: macos/x86_64/static
            cc: cc -arch x86_64
            arch: x86_64
          - os: windows-latest
            target: windows_amd64
            asset: desk-windows-amd64
            brain: brain-windows-amd64.exe
            accesskit: windows/x86_64/msvc/shared
            exe: .exe
    runs-on: ${{ matrix.os }}
    env:
      # The release vendor:sdl3 in ODIN_PIN is bound against.
      SDL3_TAG: release-3.4.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.ODIN_REPO }}
          branch: ${{ env.ODIN_PIN }}
          release: ""
          llvm-version: ${{ env.ODIN_LLVM }}
          build-type: release
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.58.0"

      - name: sdl3 (homebrew)
        if: matrix.target == 'darwin_arm64'
        run: |
          brew install --quiet sdl3
          echo "LINKFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"
      # A face to draw the smoke's text with, where jm:ui's default font
      # is: the desk looks for Noto at Arch's path, not Ubuntu's, and falls
      # back to Liberation; with neither, the page renders without text.
      - name: fonts (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-liberation
          sudo mkdir -p /usr/share/fonts/liberation
          sudo ln -sf /usr/share/fonts/truetype/liberation/*.ttf /usr/share/fonts/liberation/
      # SDL3 from source where no package serves: on Linux, console-only,
      # since nothing here opens a window and Ubuntu has no package; on the
      # Intel macOS build, the x86_64 library Homebrew on arm64 cannot give.
      - name: sdl3 (source)
        if: matrix.target == 'linux_amd64' || matrix.target == 'darwin_amd64'
        run: |
          prefix="$RUNNER_TEMP/sdl3"
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build
            extra=(-G Ninja -DSDL_UNIX_CONSOLE_BUILD=ON)
          fi
          if [ -n "${{ matrix.arch }}" ]; then extra+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}); fi
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL "$RUNNER_TEMP/sdl3-src"
          cmake -S "$RUNNER_TEMP/sdl3-src" -B "$RUNNER_TEMP/sdl3-src/build" "${extra[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl3-src/build" --parallel
          cmake --install "$RUNNER_TEMP/sdl3-src/build"
          lib=$(dirname "$(find "$prefix" -name 'libSDL3.*' -print -quit)")
          echo "LINKFLAGS=-L$lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$lib" >> "$GITHUB_ENV"

      # kb_text_shape, jm:ui/shape's shaper, from the vendored source; the
      # Windows recipe is PowerShell, so cl runs directly.
      - name: kb_text_shape
        if: runner.os != 'Windows'
        run: cd jm && CC="${{ matrix.cc || 'cc' }}" just kb
      - name: kb_text_shape (windows)
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          cd jm && mkdir -p ui/kb/lib
          cl -nologo -std:c11 -O2 -c ui/kb/vendor/kb_text_shape.c -Foui/kb/lib/kb_text_shape.obj
          lib -nologo -OUT:ui/kb/lib/kb_text_shape.lib ui/kb/lib/kb_text_shape.obj

      # Blend2D, static, with asmjit, at the revisions jm's justfile pins;
      # clang-cl on Windows, where MSVC crashes on its deflate decoder.
      - name: blend2d
        run: |
          # fetch <repo> <jm justfile variable> <dir>
          fetch() {
            local rev
            rev=$(sed -n "s/^$2 *:= *\"\([0-9a-f]*\)\".*/\1/p" jm/justfile)
            [ -n "$rev" ] || { echo "::error::no $2 in jm/justfile"; exit 1; }
            mkdir -p "$3" && git -C "$3" init -q
            git -C "$3" fetch -q --depth 1 "https://github.com/$1/$1" "$rev"
            git -C "$3" checkout -q FETCH_HEAD
          }
          src="$RUNNER_TEMP/blend2d"
          fetch blend2d blend2d_rev "$src"
          fetch asmjit asmjit_rev "$src/3rdparty/asmjit"
          extra=()
          case "$RUNNER_OS" in
            Windows) extra=(-G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded) ;;
          esac
          if [ -n "${{ matrix.arch }}" ]; then extra+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}); fi
          cmake -S "$src" -B "$src/build" "${extra[@]}" -DCMAKE_BUILD_TYPE=Release -DBLEND2D_STATIC=ON -DBLEND2D_TEST=OFF
          cmake --build "$src/build" --config Release --parallel
          mkdir -p jm/ui/blend2d/lib
          if [ "$RUNNER_OS" = Windows ]; then cp "$src/build/blend2d.lib" jm/ui/blend2d/lib/; else cp "$src/build/libblend2d.a" jm/ui/blend2d/lib/; fi

      # AccessKit: the release jm's justfile pins, checked by its hash, and
      # the member for the target rather than the runner, so the Intel
      # macOS build gets the x86_64 archive.
      - name: accesskit
        run: |
          value() { sed -n "s/^$1 *:= *\"\([^\"]*\)\".*/\1/p" jm/justfile; }
          ver=$(value accesskit_ver) sha=$(value accesskit_sha)
          zip="$RUNNER_TEMP/accesskit.zip"
          curl -sSL --max-time 600 -o "$zip" "https://github.com/AccessKit/accesskit-c/releases/download/$ver/accesskit-c-$ver.zip"
          # From stdin: Git Bash's sha256sum escapes a hash whose file name
          # holds a backslash, as RUNNER_TEMP does on Windows.
          if command -v sha256sum >/dev/null; then sum=$(sha256sum < "$zip" | cut -d' ' -f1); else sum=$(shasum -a 256 < "$zip" | cut -d' ' -f1); fi
          [ "$sum" = "$sha" ] || { echo "::error::accesskit-c $ver has sha256 $sum, expected $sha"; exit 1; }
          member="accesskit-c-$ver/lib/${{ matrix.accesskit }}/*"
          if command -v unzip >/dev/null; then unzip -q "$zip" "$member" -d "$RUNNER_TEMP/accesskit"; else 7z x -y -o"$RUNNER_TEMP/accesskit" "$zip" "$member" >/dev/null; fi
          mkdir -p jm/ui/accesskit/lib
          cp "$RUNNER_TEMP/accesskit/accesskit-c-$ver/lib/${{ matrix.accesskit }}"/* jm/ui/accesskit/lib/
          ls -l jm/ui/accesskit/lib

      - name: build
        run: |
          out=build/desk/${{ matrix.asset }}
          mkdir -p "$out"
          link=()
          if [ -n "${LINKFLAGS:-}" ]; then link=(-extra-linker-flags:"$LINKFLAGS"); fi
          # desk <package> <binary>
          desk() {
            odin build "$1" -o:speed -vet -strict-style -collection:jm="$PWD/jm" \
              -target:${{ matrix.target }} "${link[@]}" -out:"$out/$2${{ matrix.exe }}"
          }
          desk tools/desk desk
          desk tools/desk/host desk-host
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$(odin root)/vendor/sdl3/SDL3.dll" jm/ui/accesskit/lib/accesskit.dll "$out/"
          fi
          ls -l "$out"

      # The brain this run built answers the desk; the page has rendered
      # only once the vault's bullets are in it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.brain
        with:
          name: ${{ matrix.brain }}
          path: build/brain
      - name: smoke test
        if: matrix.brain
        run: |
          brain="$PWD/build/brain/${{ matrix.brain }}"
          chmod +x "$brain"
          if [ "$RUNNER_OS" = Linux ]; then ldd build/desk/${{ matrix.asset }}/desk; fi
          if [ "$RUNNER_OS" = macOS ]; then otool -L build/desk/${{ matrix.asset }}/desk; fi
          BRAIN_VAULT=testdata/vault BRAIN_STATE="$RUNNER_TEMP/state" \
            build/desk/${{ matrix.asset }}/desk${{ matrix.exe }} -brain "$brain" -page Bullets \
            -png build/${{ matrix.asset }}.png -dump > build/dump.txt
          grep -q 'fixture tool' build/dump.txt || { echo "::error::the Bullets page never showed the fixture vault"; cat build/dump.txt; exit 1; }
          [ "$(head -c 4 build/${{ matrix.asset }}.png | od -An -tx1 | tr -d ' \n')" = 89504e47 ] || { echo "::error::no PNG written"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: build/desk/${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.brain
        with:
          name: ${{ matrix.asset }}-smoke
          path: build/${{ matrix.asset }}.png
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The CLI's assets and mkpatch only: the desk's artifacts never reach
      # a release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: brain-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mkpatch
          path: assets
      # Beside each asset, mkpatch writes its zstd-compressed form and a
      # patch to it from the same asset in each of the last PATCH_FROM
      # releases, named <asset>.<old sha256>.patch so a binary finds the
      # one for itself by its own hash; it skips a patch that would not
      # beat the compressed asset. The old builds are the published files,
      # since a rebuild is not the same bytes. A release with no earlier
      # one ships the compressed assets alone.
      - name: compressed assets and patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv assets/mkpatch mkpatch && chmod +x mkpatch
          mapfile -t tags < <(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n "$PATCH_FROM")
          echo "patches from: ${tags[*]:-none}"
          for tag in "${tags[@]}"; do
            mkdir -p "old/$tag"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "old/$tag" -p 'brain-*' || true
            rm -f old/"$tag"/*.patch old/"$tag"/*.zst
          done
          for new in assets/brain-*; do
            name=$(basename "$new")
            olds=()
            for tag in "${tags[@]}"; do [ -f "old/$tag/$name" ] && olds+=(-old "old/$tag/$name"); done
            ./mkpatch -new "$new" -out assets "${olds[@]}"
          done
      - run: cd assets && sha256sum brain-* > sha256sums.txt && cat sha256sums.txt
      # The checksum file is signed with the key whose public half the
      # binary embeds; selfupdate trusts nothing that does not verify.
      - name: sign
        env:
          KEY: ${{ secrets.BRAIN_SIGNING_KEY }}
        run: |
          printf '%s\n' "$KEY" > key.pem
          openssl pkeyutl -sign -rawin -in assets/sha256sums.txt -inkey key.pem -out assets/sha256sums.txt.sig
          openssl pkeyutl -verify -rawin -in assets/sha256sums.txt -inkey key.pem -sigfile assets/sha256sums.txt.sig
          rm -f key.pem
          echo "$GITHUB_REF_NAME" > assets/version.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          prerelease: ${{ contains(github.ref_name, '-rc') }}
